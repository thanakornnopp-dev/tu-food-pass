  </svg>

  <div class="app" id="app">
    <header class="topbar">
      <button class="brand" id="brand" type="button" aria-label="TU Food Pass">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 8.5A3.5 3.5 0 017.5 5h17A3.5 3.5 0 0128 8.5v3a3 3 0 000 6v6a3.5 3.5 0 01-3.5 3.5h-17A3.5 3.5 0 014 23.5v-6a3 3 0 000-6z" fill="#e8b94b" transform="translate(0 .5)"/>
          <path d="M9.5 15.5h13a6.5 6.5 0 01-6.5 6 6.5 6.5 0 01-6.5-6zM12.5 15l5-6.2M16 15l4.5-5.4" fill="none" stroke="#44091a" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">TU <b>Food Pass</b></span>
      </button>
      <button class="tier-chip" id="tier-chip" type="button" data-action="go" data-tab="pass" data-tier="FREE">
        <svg class="ico ico--sm"><use href="#i-star"/></svg>
        <span id="tier-chip-label">Free</span>
      </button>
    </header>

    <main class="scroll" id="scroll">
      <section class="screen" id="screen-spin" data-screen="spin"></section>
      <section class="screen" id="screen-stalls" data-screen="stalls" hidden></section>
      <section class="screen" id="screen-plan" data-screen="plan" hidden></section>
      <section class="screen" id="screen-wallet" data-screen="wallet" hidden></section>
      <section class="screen" id="screen-pass" data-screen="pass" hidden></section>
    </main>

    <nav class="tabbar" id="tabbar" aria-label="เมนูหลัก">
      <button class="tab" type="button" data-action="go" data-tab="spin"><svg class="ico"><use href="#i-spin"/></svg><span>สุ่ม</span></button>
      <button class="tab" type="button" data-action="go" data-tab="stalls"><svg class="ico"><use href="#i-store"/></svg><span>ร้านค้า</span></button>
      <button class="tab" type="button" data-action="go" data-tab="plan"><svg class="ico"><use href="#i-plan"/></svg><span>แผนอาหาร</span></button>
      <button class="tab" type="button" data-action="go" data-tab="wallet"><svg class="ico"><use href="#i-ticket"/></svg><span>กระเป๋า</span></button>
      <button class="tab" type="button" data-action="go" data-tab="pass"><svg class="ico"><use href="#i-user"/></svg><span>บัตรฉัน</span></button>
    </nav>
  </div>

  <div id="layer"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <script src="js/data.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/core.js"></script>
  <script src="js/spin.js"></script>
  <script src="js/stalls.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/wallet.js"></script>
  <script src="js/pass.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
